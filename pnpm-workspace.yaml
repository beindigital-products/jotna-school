# Scripts d'installation non lancés, par choix : esbuild et unrs-resolver ne
# font que vérifier un binaire que pnpm installe déjà (paquet optionnel de la
# plateforme), msw copierait un worker vers un `msw.workerDirectory` que nous
# n'avons pas, et sharp 0.35 n'a plus de script. `allowBuilds` vaut pour pnpm 12
# (une valeur non booléenne y fait échouer l'installation en
# ERR_PNPM_IGNORED_BUILDS), `ignoredBuiltDependencies` pour pnpm 10 en CI.
allowBuilds:
  esbuild: false
  msw: false
  sharp: false
  unrs-resolver: false
ignoredBuiltDependencies:
  - esbuild
  - msw
  - sharp
  - unrs-resolver
# convex 1.35 pins ws 8.18.0 (GHSA-96hv-2xvq-fx4p, GHSA-58qx-3vcg-4xpx);
# convex 1.42+ pins 8.21.0 itself, after which this entry can go.
overrides:
  'ws@>=8.0.0 <8.21.0': 8.21.0
