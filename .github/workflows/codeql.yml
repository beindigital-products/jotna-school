name: CodeQL

# Analyse de sécurité du code. Ce fichier remplace la configuration CodeQL
# « par défaut » de GitHub, qui ne sait pas construire l'application iOS : ses
# ressources (public/, capacitor.config.json, config.xml) sortent de
# `cap sync`, hors de git, et les plugins Capacitor sont des paquets Swift
# rangés dans node_modules (ios/App/CapApp-SPM/Package.swift). Ici, le job
# Swift installe les dépendances et lance `cap sync ios` avant de compiler.
#
# La configuration par défaut doit rester coupée dans les réglages du dépôt
# (Settings > Advanced Security, ligne « CodeQL analysis ») : tant qu'elle est
# active, GitHub refuse les résultats de ce fichier.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Une fois par semaine, comme la configuration par défaut : une nouvelle
  # règle CodeQL peut trouver un problème dans du code qui n'a pas bougé.
  schedule:
    - cron: "23 4 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
            runner: ubuntu-latest
          - language: java-kotlin
            build-mode: none
            runner: ubuntu-latest
          - language: javascript-typescript
            build-mode: none
            runner: ubuntu-latest
          - language: swift
            build-mode: manual
            runner: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        if: matrix.language == 'swift'
        uses: pnpm/action-setup@v6
        with:
          version: 10

      # La CLI Capacitor 8 exige Node 22 ou plus.
      - name: Setup Node.js
        if: matrix.language == 'swift'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: matrix.language == 'swift'
        run: pnpm install --frozen-lockfile

      # Le contenu des pages ne compte pas pour l'analyse : une page vide
      # suffit à `cap sync`, sans construire le site (même méthode que
      # android-dependencies.yml).
      - name: Prepare (application iOS)
        if: matrix.language == 'swift'
        run: |
          mkdir -p out
          test -f out/index.html || printf '<!doctype html>\n' > out/index.html
          pnpm exec cap sync ios

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # Le schéma App (Xcode le crée seul, il n'est pas dans git) construit
      # aussi les plugins. Avec `-target App`, comme la construction
      # automatique de CodeQL, Xcode ne trouve pas leurs dépendances
      # (IONFilesystemLib pour le plugin Filesystem). Une seule architecture,
      # et sans signature : pas besoin de compte développeur Apple. Les trois
      # derniers réglages sont ceux que la construction automatique de CodeQL
      # passe à Xcode, pour que son traceur voie chaque compilation Swift.
      - name: Build (application iOS)
        if: matrix.build-mode == 'manual'
        run: >-
          xcodebuild build
          -project ios/App/App.xcodeproj
          -scheme App
          -destination 'generic/platform=iOS'
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGNING_ALLOWED=NO
          COMPILATION_CACHE_ENABLE_CACHING=NO
          SWIFT_ENABLE_COMPILE_CACHE=NO
          SWIFT_USE_INTEGRATED_DRIVER=NO

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
