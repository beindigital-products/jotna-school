name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lancement à la demande, sur n'importe quelle branche. Les deux déclencheurs
  # ci-dessus ne couvrent que ce qui vise `main` : sans celui-ci, la seule façon
  # d'obtenir une vérification est de rejouer un run existant, donc sur un
  # commit déjà poussé et déjà jugé.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        continue-on-error: true
        run: pnpm lint

      - name: Typecheck
        run: pnpm tsc --noEmit

      - name: Unit tests
        run: pnpm test --run

      # Deux cibles, un seul code (`lib/build-target.ts`) : le site web n'a pas
      # d'espace élève, l'application iOS/Android l'a.
      - name: Build (site web)
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL || 'https://placeholder.convex.cloud' }}
        run: |
          pnpm build
          test ! -e out/student || { echo "Le site web contient l'espace élève" >&2; exit 1; }

      - name: Build (application iOS/Android)
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL || 'https://placeholder.convex.cloud' }}
        run: |
          pnpm build:app
          test -f out/student/home/index.html || { echo "L'application n'a pas l'espace élève" >&2; exit 1; }
